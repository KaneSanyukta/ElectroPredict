<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login In Form</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/login.css')}}">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.32/build/spline-viewer.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>
    <div class="row" style="display: inline-flex;box-shadow: 9px 12px 12px #e9e7e7;">
        <div class="column">
            <div class="login-container">
                <form id="loginForm"  method="POST">
                    {{ form.hidden_tag() }}
                    <h2>Login</h2>
                    <div class="input-group">
                        <label for="email">Email:</label>
                        {{ form.email() }}
                    </div>
                    <div class="input-group">
                        <label for="password">Password:</label>
                        {{ form.password() }}
                    </div>
                    <button type="submit" class="btn">Login</button>
                    <p style="margin: 12px;
                    font-size: 14px;">Don't have an account ??? <a href="/signup" class="txt">  Sign up</a></p>
                </form> 
                <br>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}               
            </div>
        </div>
        <div class="column" id="robo" style="width: 450px;">
            <spline-viewer url="https://prod.spline.design/LKY9vlzcTkVCXCTS/scene.splinecode"></spline-viewer>
        </div>
      </div>
    
    <!-- Modal for error messages -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button id="okBtn" class="modal-btn">OK</button>
        </div>
    </div>
    
    <script src="{{url_for('static', filename='js/scripts.js')}}"></script>
</body>
</html>
